pid /run/homepage-podman-broker/nginx.pid;
error_log stderr warn;
daemon off;
events {}
http {
    access_log off;
    upstream podman {
        server unix:/run/podman/podman.sock;
    }
    server {
        listen unix:/run/homepage-podman-broker/podman.sock;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host localhost;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_buffering off;

        # Homepage uses the Docker-compatible list and one-shot stats APIs.
        # Deny inspect, archives, logs, exec, and all lifecycle operations.
        location ~ ^/(v[0-9]+\.[0-9]+/)?containers/json$ {
            limit_except GET { deny all; }
            proxy_pass http://podman;
        }
        location ~ ^/(v[0-9]+\.[0-9]+/)?containers/[a-zA-Z0-9_.-]+/stats$ {
            limit_except GET { deny all; }
            if ($args != stream=false) { return 403; }
            proxy_pass http://podman;
        }
        location ~ ^/(v[0-9]+\.[0-9]+/)?(_ping|version)$ {
            limit_except GET { deny all; }
            proxy_pass http://podman;
        }
        location / { return 403; }
    }
}
