name: Propose Nix input refresh
on:
  schedule:
    - cron: '0 18 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: flake-input-refresh
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - run: nix flake update
      - run: nix develop .#ci -c python scripts/bump-flake-release.py
      - name: Validate candidate lock
        run: nix build -L .#checks.x86_64-linux.host-evaluation .#checks.x86_64-linux.config-tests .#checks.x86_64-linux.config-package
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: maintenance/flake-inputs
          add-paths: |
            flake.lock
            VERSION
            CHANGELOG.md
          title: 'chore: refresh validated Nix inputs'
          commit-message: 'chore: refresh validated Nix inputs'
          body: |
            Refresh Nix inputs together. Host derivations and configuration tests passed in the update workflow.

            Review compatibility before merging. The update includes a patch version and changelog entry. Native deployment remains staged; no host switches run in GitHub Actions.
          draft: true
