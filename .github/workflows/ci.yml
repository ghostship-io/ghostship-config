name: Fleet checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# PR gates run once on cached host runners. Complete integration is manual on main.
concurrency:
  group: fleet-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'integration' }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment: private-source-ci
    runs-on: [self-hosted, Linux, ARM64, ghostship-fast]
    timeout-minutes: 10 # Measured 2026-10-31: the private-source import alone took
                        # 3m17s (four shallow depth=1 fetches); the old 4-minute cap
                        # cancelled every run during "Run fast repository checks".
                        # Ten minutes leaves room for the checks plus a concurrent PR.
                        # It also bounds the T3 artifact build on this warm runner;
                        # the step prints its own elapsed time.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Import pinned private sources with read-only deploy keys
        env:
          GITHUB_META_TOKEN: ${{ github.token }}
          GHOSTSHIP_AGENT_READ_KEY: ${{ secrets.GHOSTSHIP_AGENT_READ_KEY }}
          # A lock written before the organisation move still names the
          # previous account; the deployment supplies that name.
          GHOSTSHIP_TRANSITION_OWNERS: ${{ vars.GHOSTSHIP_TRANSITION_OWNERS }}
        run: python3 scripts/ci-private-inputs.py
      - name: Run fast repository checks
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          overrides="$RUNNER_TEMP/ghostship-private-overrides.txt"
          [ -s "$overrides" ] || { echo 'private inputs were not imported; refusing to evaluate anonymously' >&2; exit 1; }
          args=()
          while read -r name url; do
            [ -n "$name" ] || continue
            case "$url" in git+file://*) ;; *) echo "private input not substituted: $name" >&2; exit 1 ;; esac
            args+=(--override-input "$name" "$url")
          done < "$overrides"
          nix develop .#ci "${args[@]}" --no-write-lock-file -c scripts/check "$PR_BASE" "$PR_HEAD"
          # Build the deployment wrappers the host installs (#1747). The PR
          # runner is ARM64 like the host, and the check re-instantiates the
          # wrappers with the check's pkgs, so this is a native build.
          nix build -L "${args[@]}" --no-write-lock-file .#checks.aarch64-linux.deployment-wrappers
          # The one T3 deployment script, deploy skipped: build the exact
          # artifact a worker deploys and test it (wrappers + baked identity).
          # The runner is not a nixosConfiguration, so name the host explicitly.
          # The elapsed time is printed so the fast-lane budget stays measured.
          just_started=$(date +%s)
          NIX_BUILD_LOGS=1 nix develop .#ci "${args[@]}" --no-write-lock-file -c \
            just test --system chill-penguin --override-file "$overrides"
          echo "deploy-artifact seconds=$(( $(date +%s) - just_started ))"
      - name: Check the isolated-service evidence script
        run: |
          nix develop .#ci --no-write-lock-file -c shellcheck -s bash -e SC1091 modules/self-hosted/agent-memory-evidence.sh
          modules/self-hosted/agent-memory-evidence.sh --dry-run > /tmp/agent-memory-evidence-dry-run.txt
          test "$(grep -c '^CASE ' /tmp/agent-memory-evidence-dry-run.txt)" -eq 7
          test "$(grep -c '^SUMMARY dry-run cases=7$' /tmp/agent-memory-evidence-dry-run.txt)" -eq 1
  integration:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: private-source-main
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Import pinned private sources with read-only deploy keys
        env:
          GITHUB_META_TOKEN: ${{ github.token }}
          GHOSTSHIP_AGENT_READ_KEY: ${{ secrets.GHOSTSHIP_AGENT_READ_KEY }}
          # A lock written before the organisation move still names the
          # previous account; the deployment supplies that name.
          GHOSTSHIP_TRANSITION_OWNERS: ${{ vars.GHOSTSHIP_TRANSITION_OWNERS }}
        run: python3 scripts/ci-private-inputs.py
      - name: Validate container development workflow
        env:
          # The agent pin guard compares the pinned agent revision with the base
          # branch's, which needs the read-only agent key.
          GHOSTSHIP_AGENT_READ_KEY: ${{ secrets.GHOSTSHIP_AGENT_READ_KEY }}
        run: nix develop .#ci --no-write-lock-file -c scripts/check-integration
      - name: Evaluate hosts and run regression tests
        run: nix build -L .#checks.x86_64-linux.host-evaluation .#checks.x86_64-linux.config-tests .#checks.x86_64-linux.config-package .#checks.x86_64-linux.window-holder .#checks.x86_64-linux.deployment-wrappers
      - name: Check workflows and backup script
        run: |
          nix develop .#ci -c actionlint
          nix develop .#ci -c shellcheck -s bash -e SC1091 modules/self-hosted/backup.sh modules/self-hosted/restore-check.sh modules/self-hosted/agent-memory-evidence.sh scripts/activate-host
      - name: Scan current source for secrets
        run: nix develop .#ci -c gitleaks dir --redact --no-banner .
