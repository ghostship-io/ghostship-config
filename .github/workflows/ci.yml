name: Fleet checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require scoped private flake access
        env:
          PRIVATE_FLAKE_READ_TOKEN: ${{ secrets.GHOSTSHIP_FLAKE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_FLAKE_READ_TOKEN" ]; then
            echo "::error::Set GHOSTSHIP_FLAKE_READ_TOKEN with Contents:read for ghostship-agent and ghostship-assistant."
            exit 1
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            access-tokens = github.com=${{ secrets.GHOSTSHIP_FLAKE_READ_TOKEN }}
      - name: Validate container development workflow
        run: nix develop .#ci --no-write-lock-file -c scripts/check
      - name: Evaluate hosts and run regression tests
        run: nix build -L .#checks.x86_64-linux.host-evaluation .#checks.x86_64-linux.config-tests .#checks.x86_64-linux.config-package
      - name: Check workflows and backup script
        run: |
          nix develop .#ci -c actionlint
          nix develop .#ci -c shellcheck -s bash -e SC1091 modules/self-hosted/backup.sh modules/self-hosted/restore-check.sh
      - name: Scan current source for secrets
        run: nix develop .#ci -c gitleaks dir --redact --no-banner .
