name: Fleet checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A pull request's newer push supersedes its older run. Each commit on main
# runs to completion (its own group), so merges never cancel each other.
concurrency:
  group: fleet-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Neither private-source environment asks for a reviewer. Pull requests use
    # private-source-ci, which holds the read-only agent key, and merged code
    # on main uses private-source-main, which only the main branch may deploy
    # to. A pull request from a fork gets no environment secrets at all.
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'private-source-main' || 'private-source-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Verify public placeholders and private source lifecycle
        run: nix develop .#ci --no-write-lock-file -c python3 -B -m unittest discover -s tests -p test_private_inputs.py
      - name: Import pinned private sources with read-only deploy keys
        env:
          GITHUB_META_TOKEN: ${{ github.token }}
          GHOSTSHIP_PRIVATE_SOURCES: ${{ secrets.GHOSTSHIP_PRIVATE_SOURCES }}
          GHOSTSHIP_AGENT_READ_KEY: ${{ secrets.GHOSTSHIP_AGENT_READ_KEY }}
        run: python3 scripts/private-inputs.py import
      - name: Reject personal and account data in the tracked tree
        run: python3 scripts/check-privacy.py
      - name: Reject personal and account data in commit messages and pull request text
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="${{ github.sha }}^"
            fi
            range="$before..${{ github.sha }}"
          fi
          python3 scripts/check-privacy.py --commit-range "$range" --pr-event "$GITHUB_EVENT_PATH" 
      - name: Validate container development workflow
        env:
          # The agent pin guard compares the pinned agent revision with the base
          # branch's, which needs the read-only agent key.
          GHOSTSHIP_AGENT_READ_KEY: ${{ secrets.GHOSTSHIP_AGENT_READ_KEY }}
        run: nix develop .#ci --no-write-lock-file -c scripts/check
      - name: Evaluate hosts and run regression tests
        run: nix build -L .#checks.x86_64-linux.host-evaluation .#checks.x86_64-linux.config-tests .#checks.x86_64-linux.config-package
      - name: Check workflows and backup script
        run: |
          nix develop .#ci -c actionlint
          nix develop .#ci -c shellcheck -s bash -e SC1091 modules/self-hosted/backup.sh modules/self-hosted/restore-check.sh scripts/activate-host
      - name: Scan current source for secrets
        run: nix develop .#ci -c gitleaks dir --redact --no-banner .
