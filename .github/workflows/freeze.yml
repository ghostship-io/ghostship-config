name: Merge freeze
# Marks every pull request head with the `ghostship/freeze` status that main
# requires: success while the repository is not frozen, failure while it is.
# `agent freeze set` and `agent freeze clear` re-mark the heads that are
# already open; this workflow marks each new head (docs/fleet-operations.md).
# It runs as pull_request_target: the workflow and the script come from main,
# never from the pull request, so a pull request cannot mark itself unfrozen.
# No pull request code is checked out or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  statuses: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Decide the freeze status
        id: decide
        env:
          GHOSTSHIP_FREEZE: ${{ vars.GHOSTSHIP_FREEZE }}
        run: python3 scripts/freeze-status >> "$GITHUB_OUTPUT"
      - name: Mark the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ steps.decide.outputs.state }}
          DESCRIPTION: ${{ steps.decide.outputs.description }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" \
            -f context=ghostship/freeze -f description="$DESCRIPTION" >/dev/null
