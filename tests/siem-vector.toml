# Vector unit tests for the SIEM pipeline (modules/self-hosted/siem/vector).
# Catches secrets reaching the store unredacted and parsers silently losing
# the fields detection rules match on. Run by scripts/check from the repo root.

[sources.input]
type = "demo_logs"
format = "shuffle"
lines = ["unused"]

[transforms.journal_shape]
type = "remap"
inputs = ["input"]
file = "modules/self-hosted/siem/vector/journal.vrl"

[transforms.plex_shape]
type = "remap"
inputs = ["input"]
file = "modules/self-hosted/siem/vector/plex.vrl"

[transforms.nginx_shape]
type = "remap"
inputs = ["input"]
file = "modules/self-hosted/siem/vector/nginx.vrl"

[transforms.redacted]
type = "remap"
inputs = ["journal_shape", "plex_shape", "nginx_shape"]
file = "modules/self-hosted/siem/vector/redact.vrl"

[sinks.out]
type = "blackhole"
inputs = ["redacted"]

[[tests]]
name = "secrets in container output are redacted"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = "GET /api/v3/queue?apikey=abc123def&page=1 Authorization: Bearer eyJhbGciOi.payload.sig https://user:hunter2@example.com/x"
CONTAINER_NAME = "sonarr"
_SYSTEMD_UNIT = "libpod-conmon-0123.scope"
_TRANSPORT = "journal"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.message, "GET /api/v3/queue?apikey=[REDACTED]&page=1 Authorization: Bearer [REDACTED] https://user:[REDACTED]@example.com/x")
assert_eq!(.stream, "container/sonarr")
'''

[[tests]]
name = "AppArmor audit records keep their fields and decoded names"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = 'apparmor="DENIED" operation="open" class="file" profile="ghostship-plex//server" name="2F636F6E666967204C6962" pid=12 comm="Plex Media Serv" requested_mask="r" denied_mask="r"'
_TRANSPORT = "audit"
_AUDIT_TYPE_NAME = "AVC"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.apparmor, "DENIED")
assert_eq!(.aa_profile, "ghostship-plex//server")
assert_eq!(.aa_name, "/config Lib")
assert_eq!(.stream, "audit")
'''

[[tests]]
name = "audit watch hits keep their rule key"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = 'arch=c00000b7 syscall=56 success=yes exe="/run/current-system/sw/bin/vim" key="identity" auid=0'
_TRANSPORT = "audit"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.audit_key, "identity")
assert_eq!(.audit_exe, "/run/current-system/sw/bin/vim")
'''

[[tests]]
name = "Falco JSON alerts are unpacked"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = '{"output":"Warning Read sensitive file untrusted","priority":"Warning","rule":"Read sensitive file untrusted","tags":["T1555","container"],"output_fields":{"container.name":"sonarr","proc.cmdline":"cat /etc/shadow"}}'
_SYSTEMD_UNIT = "falco.service"
_TRANSPORT = "stdout"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.falco_rule, "Read sensitive file untrusted")
assert_eq!(.falco_priority, "Warning")
assert_eq!(.falco."container.name", "sonarr")
'''

[[tests]]
name = "Plex requests keep the client and network class, without tokens"
[[tests.inputs]]
insert_at = "plex_shape"
type = "log"
[tests.inputs.log_fields]
message = "Oct 21, 2026 02:12:57.564 [130269293146336] DEBUG - Request: [203.0.113.9:34652 (WAN)] GET /player/timeline?X-Plex-Token=SECRET123&state=playing (14 live) #4c13 Signed-in Token (owner)"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.kind, "request")
assert_eq!(.client_ip, "203.0.113.9")
assert_eq!(.network, "WAN")
assert_eq!(.path, "/player/timeline?X-Plex-Token=[REDACTED]&state=playing")
assert!(!contains(string!(.message), "SECRET123"))
'''

[[tests]]
name = "nginx access lines expose the request for exploit rules"
[[tests.inputs]]
insert_at = "nginx_shape"
type = "log"
[tests.inputs.log_fields]
message = '203.0.113.7 - - [21/Oct/2026:01:00:00 +0000] "GET /index.php?%ADd+allow_url_include%3d1 HTTP/1.1" 404 153 "-" "curl/8"'
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.client_ip, "203.0.113.7")
assert_eq!(.path, "/index.php?%ADd+allow_url_include%3d1")
assert_eq!(.status, 404)
'''

[[tests]]
name = "every structured field is redacted, including Falco command lines"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = '{"output":"Warning shell","priority":"Warning","rule":"Terminal shell in container","output_fields":{"proc.cmdline":"mariadb-upgrade -uroot -phunter2pass --check","proc.exepath":"/usr/bin/mariadb-upgrade","fd.name":"/x"},"tags":["shell"]}'
SYSLOG_IDENTIFIER = "falco"
_SYSTEMD_UNIT = "falco.service"
_TRANSPORT = "stdout"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
encoded = encode_json(.)
assert!(!contains(encoded, "hunter2pass"), "password reached the store: " + encoded)
'''

[[tests]]
name = "headers, cookies, JWTs, password flags and private keys are redacted; detection text stays"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = "authorization: tokenvalue123 Cookie: sid=abc123; theme=dark x=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.c2lnbmF0dXJlaGVyZQ tool --password=s3cret find / -perm -4000 -----BEGIN OPENSSH PRIVATE KEY-----\nAAAAB3NzaC1\n-----END OPENSSH PRIVATE KEY-----"
CONTAINER_NAME = "sonarr"
_SYSTEMD_UNIT = "libpod-conmon-0123.scope"
_TRANSPORT = "journal"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
m = string!(.message)
assert!(!contains(m, "tokenvalue123"), m)
assert!(!contains(m, "abc123"), m)
assert!(!contains(m, "eyJzdWIi"), m)
assert!(!contains(m, "s3cret"), m)
assert!(!contains(m, "AAAAB3NzaC1"), m)
assert!(contains(m, "find / -perm -4000"), m)
'''

[[tests]]
name = "secret names are redacted in every shape a log carries them"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = '{"password":"FAKEpasswordvalue"} {"token":"FAKEtokenvalue"} {"cookie":"sid=FAKEcookievalue"} {"api_key":"FAKEapikeyvalue"} {"client_secret":"FAKEclientsecretvalue"} {"authorization":"FAKEschemelesstoken"} password: FAKEcolonvalue client_secret: FAKEclientsecretcolon password="FAKEquotedvalue" token=FAKEeqvalue'
_TRANSPORT = "journal"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
m = string!(.message)
assert_eq!(m, "{\"password\":\"[REDACTED]\"} {\"token\":\"[REDACTED]\"} {\"cookie\":\"[REDACTED]\"} {\"api_key\":\"[REDACTED]\"} {\"client_secret\":\"[REDACTED]\"} {\"authorization\":\"[REDACTED]\"} password: [REDACTED] client_secret: [REDACTED] password=\"[REDACTED]\" token=[REDACTED]")
assert!(!contains(m, "FAKEpasswordvalue"), m)
assert!(!contains(m, "FAKEtokenvalue"), m)
assert!(!contains(m, "FAKEcookievalue"), m)
assert!(!contains(m, "FAKEapikeyvalue"), m)
assert!(!contains(m, "FAKEclientsecretvalue"), m)
assert!(!contains(m, "FAKEschemelesstoken"), m)
assert!(!contains(m, "FAKEcolonvalue"), m)
assert!(!contains(m, "FAKEclientsecretcolon"), m)
assert!(!contains(m, "FAKEquotedvalue"), m)
assert!(!contains(m, "FAKEeqvalue"), m)
'''

[[tests]]
name = "the shapes that were already sealed stay sealed"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = 'password=FAKEeqsecret token=FAKEeqsecretvalue Authorization: Bearer FAKEbearersecret Cookie: sid=FAKEcookiesecret x-api-key: FAKEapikeysecret {"authorization":"Bearer FAKEjsonbearersecret"}'
_TRANSPORT = "journal"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
m = string!(.message)
assert_eq!(m, "password=[REDACTED] token=[REDACTED] Authorization: Bearer [REDACTED] Cookie: [REDACTED] x-api-key: [REDACTED] {\"authorization\":\"Bearer [REDACTED]\"}")
assert!(!contains(m, "FAKEeqsecret"), m)
assert!(!contains(m, "FAKEeqsecretvalue"), m)
assert!(!contains(m, "FAKEbearersecret"), m)
assert!(!contains(m, "FAKEcookiesecret"), m)
assert!(!contains(m, "FAKEapikeysecret"), m)
assert!(!contains(m, "FAKEjsonbearersecret"), m)
'''

[[tests]]
name = "names that only start with a secret word keep their value"
[[tests.inputs]]
insert_at = "journal_shape"
type = "log"
[tests.inputs.log_fields]
message = "session_count: 3 retry_after=30s\npassword_policy: strict signal: reached\n{\"status\":\"ok\",\"retries\":2,\"auth_method\":\"proxy\"}"
_TRANSPORT = "journal"
[[tests.outputs]]
extract_from = "redacted"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.message, "session_count: 3 retry_after=30s\npassword_policy: strict signal: reached\n{\"status\":\"ok\",\"retries\":2,\"auth_method\":\"proxy\"}")
'''
