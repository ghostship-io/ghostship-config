# Browser stage: the compositor that hosts one identity's Chrome windows.
#
# Every agent drives its own window through target-scoped DevTools input,
# which needs no compositor focus. Focus changes are what break concurrent
# agents (a deactivated window blurs its focused field), so no window is
# ever focused automatically: not on map, not on activation requests.
output * resolution 1920x1080 position 0 0
xwayland disable
default_border none
default_floating_border none
focus_on_window_activation none
focus_follows_mouse no
mouse_warping none
no_focus [all]
# Windows tile, one per workspace, at a fixed 1600x900 in the top left of a
# 1920x1080 output (the gaps fill the rest), so page coordinates and window
# sizes never change. Tiled windows stay on their workspace wherever their
# output sits; stage-control stacks every output at 0,0 (see there).
gaps inner 0
gaps right 320
gaps bottom 180
# New windows map on a hidden workspace, so they cannot take focus even when
# the visible workspace is empty; stage-control then gives each window an
# output of its own, and focus rests on the empty "idle" workspace.
assign [app_id=".*"] workspace stage-new
# Publish this stage's Wayland socket for the launcher (run-chrome).
exec sh -c 'printf "%s\n" "$WAYLAND_DISPLAY" > "$GHOSTSHIP_STAGE_DISPLAY_FILE"'
