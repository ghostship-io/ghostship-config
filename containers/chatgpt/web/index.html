<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#171717">
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/workstation.css">
  <title>ChatGPT workstation</title>
</head>
<body>
<div id="workstation">
  <header aria-label="Workstation controls">
    <strong>ChatGPT</strong><span id="connection" role="status">Connecting…</span>
    <nav aria-label="Display and input">
      <button id="fit" type="button">Fit screen</button>
      <button id="keyboard" type="button">Keyboard</button>
      <button id="clipboard" type="button" aria-expanded="false" aria-controls="clipboard-panel">Clipboard</button>
      <button id="files" type="button" aria-expanded="false" aria-controls="files-panel">Files</button>
      <button id="tools" type="button" aria-expanded="false" aria-controls="tools-panel">Tools</button>
      <button id="install" type="button" hidden>Install app</button>
    </nav>
  </header>
  <section id="clipboard-panel" class="panel" aria-label="Clipboard" hidden>
    <label for="clipboard-text">Text shared with the workstation</label>
    <textarea id="clipboard-text" rows="2" spellcheck="false"></textarea>
    <div class="actions"><button id="paste" type="button">Send to workstation</button><button id="copy" type="button">Copy to this device</button></div>
  </section>
  <section id="files-panel" class="panel" aria-label="File transfer" hidden>
    <p>Uploads and downloads use <code>~/Transfers</code> in the workstation.</p>
    <div class="actions"><button id="upload" type="button">Upload files</button><a href="/files/" target="_blank" rel="noopener">Download files</a></div>
  </section>
  <section id="tools-panel" class="panel" aria-label="Workstation tools" hidden>
    <div class="actions">
      <button id="terminal" type="button">Workstation terminal</button>
      <button id="browser" type="button">Chromium</button>
      <button id="show-app" type="button">Show ChatGPT</button>
      <button id="sound" type="button" aria-pressed="true">Sound</button>
      <button id="microphone" type="button" aria-pressed="false">Microphone</button>
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="reconnect" type="button">Reconnect</button>
    </div>
  </section>
  <main id="desktop" aria-label="ChatGPT desktop"><div id="app"></div></main>
  <footer id="notice" role="status" hidden></footer>
</div>
<script type="module" src="/workstation.js"></script>
</body>
</html>
